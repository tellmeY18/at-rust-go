[package]
name = "atrg-db"
description = "Database layer: SQLite and PostgreSQL pool and migrations for at-rust-go"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["sqlite"]
# Compile in support for SQLite as a backend (default).
sqlite = ["sqlx/sqlite"]
# Compile in support for PostgreSQL as a backend.
postgres = ["sqlx/postgres"]

[dependencies]
sqlx = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
atrg-core = { workspace = true, default-features = false, features = ["postgres"] }
atrg-auth = { workspace = true, default-features = false, features = ["postgres"] }
atrg-stream = { workspace = true, features = ["postgres"] }
atrg-email = { workspace = true, features = ["postgres"] }
atrg-identity = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true
