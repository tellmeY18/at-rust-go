[package]
name = "atrg-feed"
description = "Feed generator framework for at-rust-go: register feeds and serve skeletons"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atrg-core = { workspace = true }
atrg-xrpc = { workspace = true }
atrg-auth = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"
atrg-db = { workspace = true, features = ["sqlite"] }
atrg-identity = { workspace = true }
reqwest = { workspace = true }
