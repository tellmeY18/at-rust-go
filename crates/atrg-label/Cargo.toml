[package]
name = "atrg-label"
description = "Labeler framework for at-rust-go: create, sign, store, and stream AT Protocol labels"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atrg-core = { workspace = true }
atrg-xrpc = { workspace = true }
# atrg-label currently only persists labels in SQLite. Apps using PostgreSQL
# for the rest of their data still need a SQLite pool for the labeler store
# (or can wait for follow-up Postgres support in this addon crate).
atrg-db = { workspace = true, features = ["sqlite"] }
axum = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"
atrg-identity = { workspace = true }
reqwest = { workspace = true }
