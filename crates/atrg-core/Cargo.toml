[package]
name = "atrg-core"
description = "Core framework: AppState, config, app builder for at-rust-go"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atrg-db = { workspace = true }
atrg-identity = { workspace = true }
atrg-stream = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
base64 = "0.22"
rand = { workspace = true }
hex = { workspace = true }

# Optional Phase 7-11 crate integrations
# NOTE: Only atrg-firehose can be a direct dep here because it does NOT
# depend on atrg-core (it defines its own config types to avoid cycles).
# atrg-feed and atrg-label depend on atrg-core (via atrg-auth → atrg-core),
# so they CANNOT be deps of atrg-core. Instead, their routes are mounted
# via the generic `.mount(router)` or `.with_feed_generator(router)` /
# `.with_labeler(router)` convenience methods that accept Router<AppState>.
atrg-firehose = { workspace = true, optional = true }

[features]
default = ["firehose"]
firehose = ["dep:atrg-firehose"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"
