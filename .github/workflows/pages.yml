name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Build API docs
        run: cargo +nightly doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options"

      - name: Build doc pages from markdown
        run: bash scripts/build-docs.sh _build/docs

      - name: Assemble site
        run: |
          # Build into a clean output directory
          mkdir -p _build/api

          # Landing page (committed to repo at site/index.html)
          cp site/index.html _build/index.html

          # LLM reference files
          cp llms.txt _build/llms.txt
          cp llms-full.txt _build/llms-full.txt

          # _build/docs/ already populated by build-docs.sh above

          # API reference (rustdoc output)
          cp -r target/doc/* _build/api/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
