name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Build API docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options"

      - name: Assemble site
        run: |
          mkdir -p _site/api

          cp llms.txt _site/llms.txt
          cp llms-full.txt _site/llms-full.txt
          cp -r target/doc/* _site/api/

          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>at-rust-go (atrg) — AT Protocol Backend Framework</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 4rem auto; padding: 0 1rem; color: #1a1a1a; line-height: 1.6; }
              h1 { font-size: 1.8rem; }
              a { color: #0969da; }
              code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
              .links { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; }
              .links a { font-size: 1.1rem; }
              pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow-x: auto; }
            </style>
          </head>
          <body>
            <h1>at-rust-go (atrg)</h1>
            <p>Batteries-included Rust backend framework for <a href="https://atproto.com">AT Protocol</a> applications. API-only / headless.</p>

            <pre><code>cargo install atrg-cli
          atrg new my-app && cd my-app && atrg dev</code></pre>

            <div class="links">
              <a href="https://github.com/tellmeY18/at-rust-go">📦 GitHub Repository</a>
              <a href="https://crates.io/crates/atrg-cli">📥 crates.io (atrg-cli)</a>
              <a href="/at-rust-go/api/atrg_core/">📖 API Documentation</a>
              <a href="/at-rust-go/llms.txt">🤖 llms.txt (for AI agents)</a>
              <a href="/at-rust-go/llms-full.txt">🤖 llms-full.txt (complete API reference)</a>
            </div>

            <h2>Crates</h2>
            <ul>
              <li><a href="/at-rust-go/api/atrg_core/"><code>atrg-core</code></a> — AppState, Config, app builder</li>
              <li><a href="/at-rust-go/api/atrg_auth/"><code>atrg-auth</code></a> — OAuth, sessions, JWT verification</li>
              <li><a href="/at-rust-go/api/atrg_db/"><code>atrg-db</code></a> — SQLite pool and migrations</li>
              <li><a href="/at-rust-go/api/atrg_xrpc/"><code>atrg-xrpc</code></a> — XRPC route helpers</li>
              <li><a href="/at-rust-go/api/atrg_identity/"><code>atrg-identity</code></a> — DID/handle resolution</li>
              <li><a href="/at-rust-go/api/atrg_stream/"><code>atrg-stream</code></a> — Jetstream consumer</li>
              <li><a href="/at-rust-go/api/atrg_firehose/"><code>atrg-firehose</code></a> — Relay firehose consumer</li>
              <li><a href="/at-rust-go/api/atrg_repo/"><code>atrg-repo</code></a> — Record CRUD, blobs, AT-URIs</li>
              <li><a href="/at-rust-go/api/atrg_feed/"><code>atrg-feed</code></a> — Feed generator framework</li>
              <li><a href="/at-rust-go/api/atrg_label/"><code>atrg-label</code></a> — Labeler framework</li>
              <li><a href="/at-rust-go/api/atrg_codegen/"><code>atrg-codegen</code></a> — Lexicon code generator</li>
              <li><a href="/at-rust-go/api/atrg_testing/"><code>atrg-testing</code></a> — Test utilities</li>
              <li><a href="/at-rust-go/api/atrg_cli/"><code>atrg-cli</code></a> — CLI binary</li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
