name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  # Reduce peak memory during compilation
  CARGO_BUILD_JOBS: 1

jobs:
  # ─── Fast checks (no heavy compilation) ───────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Audit & Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No unwrap() in production library crates
        run: |
          # For each .rs file, extract only lines BEFORE #[cfg(test)] and check for .unwrap()
          FOUND=""
          for f in $(find \
            crates/atrg-core/src \
            crates/atrg-auth/src \
            crates/atrg-db/src \
            crates/atrg-stream/src \
            crates/atrg-xrpc/src \
            crates/atrg-identity/src \
            crates/atrg-codegen/src \
            -name '*.rs'); do
            # Get the line number of #[cfg(test)] — only check lines before it
            TEST_LINE=$(grep -n '#\[cfg(test)\]' "$f" | head -1 | cut -d: -f1)
            if [ -n "$TEST_LINE" ]; then
              HITS=$(head -n "$((TEST_LINE - 1))" "$f" | grep -n '\.unwrap()' || true)
            else
              HITS=$(grep -n '\.unwrap()' "$f" || true)
            fi
            if [ -n "$HITS" ]; then
              while IFS= read -r line; do
                FOUND="${FOUND}${f}:${line}\n"
              done <<< "$HITS"
            fi
          done
          if [ -n "$FOUND" ]; then
            echo "FAIL: unwrap() found in production (non-test) code:"
            printf "$FOUND"
            exit 1
          fi
          echo "✓ No unwrap() in production library code"

      - name: No template/frontend crates in dependency tree
        run: |
          # Need Rust to run cargo tree
          rustup default stable
          cargo tree --workspace 2>/dev/null \
            | grep -iE "minijinja|tera|askama|handlebars" \
            && (echo "FAIL: frontend template crate found" && exit 1) \
            || echo "✓ No template/frontend crates in dependency tree"

  # ─── Build & test (needs more RAM) ────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-test

      - name: Build workspace
        run: cargo build --workspace

      - name: Run all tests
        run: cargo test --workspace

  # ─── Build CLI release binary (reused by downstream jobs) ─────────
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-cli

      - name: Build CLI (release)
        run: cargo build -p atrg-cli --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: atrg-cli
          path: target/release/atrg
          retention-days: 1

  # ─── Scaffold & server E2E (uses pre-built CLI) ──────────────────
  scaffold-e2e:
    name: Scaffold & Server E2E
    needs: [build-cli, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-test

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: atrg-cli
          path: /tmp/bin
      - run: chmod +x /tmp/bin/atrg

      - name: Scaffold project
        run: /tmp/bin/atrg new e2e-test-app --path /tmp/e2e-test-app

      - name: Patch scaffold to use local crates
        working-directory: /tmp/e2e-test-app
        run: |
          cat >> Cargo.toml << EOF

          [patch.crates-io]
          atrg-core = { path = "${{ github.workspace }}/crates/atrg-core" }
          atrg-auth = { path = "${{ github.workspace }}/crates/atrg-auth" }
          atrg-db = { path = "${{ github.workspace }}/crates/atrg-db" }
          atrg-identity = { path = "${{ github.workspace }}/crates/atrg-identity" }
          atrg-stream = { path = "${{ github.workspace }}/crates/atrg-stream" }
          atrg-xrpc = { path = "${{ github.workspace }}/crates/atrg-xrpc" }
          atrg-codegen = { path = "${{ github.workspace }}/crates/atrg-codegen" }
          atrg-testing = { path = "${{ github.workspace }}/crates/atrg-testing" }
          EOF

      - name: Check scaffold compiles
        working-directory: /tmp/e2e-test-app
        run: cargo check

      - name: Build scaffold binary
        working-directory: /tmp/e2e-test-app
        run: cargo build

      - name: Test server endpoints
        working-directory: /tmp/e2e-test-app
        run: |
          # Start server in background
          cargo run &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          # Wait for server to be ready (up to 60s)
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/healthz > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "FAIL: Server did not start within 60s"
              exit 1
            fi
            sleep 1
          done

          PASS=0
          FAIL=0
          check() {
            local name="$1" expect="$2" actual="$3"
            if echo "$actual" | grep -q "$expect"; then
              echo "  ✓ $name"
              PASS=$((PASS + 1))
            else
              echo "  ✗ $name (expected: $expect, got: $actual)"
              FAIL=$((FAIL + 1))
            fi
          }

          echo "=== Endpoint Tests ==="

          # Health
          HEALTH=$(curl -sf http://127.0.0.1:3000/healthz)
          check "/healthz returns ok" '"ok":true' "$HEALTH"

          # Readiness
          READY=$(curl -sf http://127.0.0.1:3000/readyz)
          check "/readyz returns ok" '"ok":true' "$READY"
          check "/readyz shows database" '"database":"connected"' "$READY"

          # Index
          INDEX=$(curl -sf http://127.0.0.1:3000/)
          check "/ returns status ok" '"status":"ok"' "$INDEX"

          # 404
          BODY_404=$(curl -s http://127.0.0.1:3000/does-not-exist)
          check "404 returns JSON error" '"error":"not_found"' "$BODY_404"

          # Auth session (no auth → 401)
          STATUS_SESSION=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/auth/session)
          check "/auth/session → 401" "401" "$STATUS_SESSION"

          # Auth login (no handle → 400)
          STATUS_LOGIN=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/auth/login)
          check "/auth/login → 400" "400" "$STATUS_LOGIN"

          # Client metadata
          META=$(curl -sf http://127.0.0.1:3000/client-metadata.json)
          check "/client-metadata.json" '"client_id"' "$META"

          # Well-known
          WK=$(curl -sf http://127.0.0.1:3000/.well-known/oauth-protected-resource)
          check "/.well-known/oauth-protected-resource" '"resource"' "$WK"

          # Content-Type
          CT=$(curl -sf -o /dev/null -w "%{content_type}" http://127.0.0.1:3000/)
          check "Content-Type is JSON" "application/json" "$CT"

          # X-Request-Id
          HEADERS=$(curl -sf -D - http://127.0.0.1:3000/ -o /dev/null 2>&1)
          check "X-Request-Id present" "x-request-id" "$(echo "$HEADERS" | tr '[:upper:]' '[:lower:]')"

          echo ""
          echo "=== Results: $PASS passed, $FAIL failed ==="
          [ "$FAIL" -eq 0 ] || exit 1

  # ─── Codegen E2E (uses pre-built CLI, lightweight) ────────────────
  codegen-e2e:
    name: Codegen E2E
    needs: [build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: atrg-cli
          path: /tmp/bin
      - run: chmod +x /tmp/bin/atrg

      - name: Test CLI commands
        run: |
          /tmp/bin/atrg version
          /tmp/bin/atrg routes

      - name: Test lexicon code generation
        run: |
          mkdir -p /tmp/lexicons /tmp/generated

          cat > /tmp/lexicons/ping.json << 'LEXEOF'
          {
            "lexicon": 1,
            "id": "com.example.ping",
            "defs": {
              "main": {
                "type": "query",
                "description": "A simple ping endpoint",
                "output": {
                  "encoding": "application/json",
                  "schema": {
                    "type": "object",
                    "required": ["pong"],
                    "properties": {
                      "pong": { "type": "boolean" },
                      "echo": { "type": "string" }
                    }
                  }
                }
              }
            }
          }
          LEXEOF

          cat > /tmp/lexicons/todo.json << 'LEXEOF'
          {
            "lexicon": 1,
            "id": "com.example.todo.createItem",
            "defs": {
              "main": {
                "type": "procedure",
                "description": "Create a todo item",
                "input": {
                  "encoding": "application/json",
                  "schema": {
                    "type": "object",
                    "required": ["title"],
                    "properties": {
                      "title": { "type": "string", "max_length": 500 },
                      "done": { "type": "boolean" }
                    }
                  }
                },
                "output": {
                  "encoding": "application/json",
                  "schema": {
                    "type": "object",
                    "required": ["uri"],
                    "properties": {
                      "uri": { "type": "string" }
                    }
                  }
                }
              }
            }
          }
          LEXEOF

          /tmp/bin/atrg generate --input /tmp/lexicons --output /tmp/generated

          echo "--- Generated files ---"
          ls -la /tmp/generated/

          echo "--- types.rs ---"
          cat /tmp/generated/types.rs

          # Verify generated types
          grep -q "ComExamplePingOutput" /tmp/generated/types.rs \
            || (echo "FAIL: missing ComExamplePingOutput" && exit 1)
          grep -q "ComExampleTodoCreateItemInput" /tmp/generated/types.rs \
            || (echo "FAIL: missing ComExampleTodoCreateItemInput" && exit 1)
          grep -q "pub title: String" /tmp/generated/types.rs \
            || (echo "FAIL: missing title field" && exit 1)

          # Verify routes were generated
          grep -q "xrpc_routes" /tmp/generated/routes.rs \
            || (echo "FAIL: missing xrpc_routes" && exit 1)

          echo "✓ Codegen E2E passed"

  # ─── Documentation build ──────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build docs (warning-free)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ─── Final gate ───────────────────────────────────────────────────
  e2e-pass:
    name: E2E Gate ✓
    if: always()
    needs: [lint, audit, test, scaffold-e2e, codegen-e2e, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          echo "Job results:"
          echo "  lint:         ${{ needs.lint.result }}"
          echo "  audit:        ${{ needs.audit.result }}"
          echo "  test:         ${{ needs.test.result }}"
          echo "  scaffold-e2e: ${{ needs.scaffold-e2e.result }}"
          echo "  codegen-e2e:  ${{ needs.codegen-e2e.result }}"
          echo "  docs:         ${{ needs.docs.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.scaffold-e2e.result }}" != "success" ] || \
             [ "${{ needs.codegen-e2e.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ]; then
            echo ""
            echo "FAIL: One or more E2E jobs did not pass"
            exit 1
          fi

          echo ""
          echo "==============================="
          echo "  All E2E checks passed ✓"
          echo "==============================="
