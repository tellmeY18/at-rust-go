name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Use --test-threads=1 to avoid env-var race conditions in
      # atrg-core env_override tests (they mutate process-global state).
      - name: Run tests
        run: cargo test --workspace --all-features -- --test-threads=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # ── Generate workspace-wide coverage (lcov for upload) ───────
      - name: Generate coverage (lcov)
        run: |
          cargo llvm-cov --workspace \
            --all-features \
            --lcov \
            --output-path lcov.info \
            -- --test-threads=1

      # ── Per-crate coverage enforcement ───────────────────────────
      # Uses JSON output for reliable parsing. Each crate in the list
      # must meet the minimum line-coverage threshold or the job fails.
      - name: Enforce per-crate coverage thresholds
        run: |
          THRESHOLD=85
          FAILED=0
          SUMMARY=""

          for CRATE in atrg-repo atrg-firehose atrg-feed atrg-label; do
            echo "──────────────────────────────────────"
            echo "Checking coverage for ${CRATE} (threshold: ${THRESHOLD}%)"

            JSON=$(cargo llvm-cov --package "$CRATE" --json -- --test-threads=1 2>/dev/null)

            # Extract line coverage from the JSON totals.
            # The JSON schema has .data[0].totals.lines.percent
            LINE_PCT=$(echo "$JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          pct = data['data'][0]['totals']['lines']['percent']
          print(f'{pct:.2f}')
          " 2>/dev/null || echo "")

            if [ -z "$LINE_PCT" ]; then
              echo "⚠ Could not parse coverage for ${CRATE}, skipping"
              SUMMARY="${SUMMARY}| \`${CRATE}\` | ⚠ parse error | ${THRESHOLD}% |\n"
              continue
            fi

            # Compare using python3 (always available on ubuntu-latest,
            # avoids bc/awk float-comparison fragility).
            PASS=$(python3 -c "print(1 if float('${LINE_PCT}') >= ${THRESHOLD} else 0)")

            if [ "$PASS" = "1" ]; then
              echo "✓ ${CRATE}: ${LINE_PCT}% >= ${THRESHOLD}%"
              SUMMARY="${SUMMARY}| \`${CRATE}\` | ✅ ${LINE_PCT}% | ${THRESHOLD}% |\n"
            else
              echo "✗ ${CRATE}: ${LINE_PCT}% < ${THRESHOLD}% — FAIL"
              SUMMARY="${SUMMARY}| \`${CRATE}\` | ❌ ${LINE_PCT}% | ${THRESHOLD}% |\n"
              FAILED=1
            fi
          done

          echo ""
          echo "══════════════════════════════════════"

          # Write GitHub Actions job summary
          {
            echo "### Coverage Report"
            echo ""
            echo "| Crate | Line Coverage | Threshold |"
            echo "|-------|-------------|-----------|"
            printf "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" = "1" ]; then
            echo "FAIL: One or more crates are below the ${THRESHOLD}% coverage threshold"
            exit 1
          fi

          echo "All crates meet the ${THRESHOLD}% coverage threshold ✓"

      # ── Upload coverage to Codecov (optional, non-blocking) ──────
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p atrg-cli --release
