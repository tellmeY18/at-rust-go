name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # Delay between publishing dependent crates to allow crates.io index propagation
  PUBLISH_DELAY: 30

jobs:
  # Gate: ensure the workspace builds and tests pass before publishing
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match workspace version ($CARGO_VERSION)"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Verify packaging (all crates)
        run: |
          for crate in \
            atrg-db \
            atrg-identity \
            atrg-stream \
            atrg-firehose \
            atrg-codegen \
            atrg-core \
            atrg-auth \
            atrg-xrpc \
            atrg-cli \
            atrg-repo \
            atrg-feed \
            atrg-label \
            atrg-testing; do
            echo "--- Package: $crate ---"
            cargo package --no-verify -p "$crate"
          done

  # Publish all crates in topological dependency order
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: verify
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io
        run: cargo login "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      # Level 0 — Leaf crates (no internal dependencies)
      - name: "Publish Level 0: atrg-db"
        run: cargo publish -p atrg-db --no-verify || echo "Already published"

      - name: "Publish Level 0: atrg-identity"
        run: cargo publish -p atrg-identity --no-verify || echo "Already published"

      - name: "Publish Level 0: atrg-stream"
        run: cargo publish -p atrg-stream --no-verify || echo "Already published"

      - name: "Publish Level 0: atrg-firehose"
        run: cargo publish -p atrg-firehose --no-verify || echo "Already published"

      - name: "Publish Level 0: atrg-codegen"
        run: cargo publish -p atrg-codegen --no-verify || echo "Already published"

      - name: Wait for crates.io index propagation (Level 0 → Level 1)
        run: sleep $PUBLISH_DELAY

      # Level 1 — Depends on Level 0
      - name: "Publish Level 1: atrg-core"
        run: cargo publish -p atrg-core --no-verify || echo "Already published"

      - name: Wait for crates.io index propagation (Level 1 → Level 2)
        run: sleep $PUBLISH_DELAY

      # Level 2 — Depends on Level 0 + Level 1
      - name: "Publish Level 2: atrg-auth"
        run: cargo publish -p atrg-auth --no-verify || echo "Already published"

      - name: "Publish Level 2: atrg-xrpc"
        run: cargo publish -p atrg-xrpc --no-verify || echo "Already published"

      - name: "Publish Level 2: atrg-cli"
        run: cargo publish -p atrg-cli --no-verify || echo "Already published"

      - name: Wait for crates.io index propagation (Level 2 → Level 3)
        run: sleep $PUBLISH_DELAY

      # Level 3 — Depends on Level 0 + Level 1 + Level 2
      - name: "Publish Level 3: atrg-repo"
        run: cargo publish -p atrg-repo --no-verify || echo "Already published"

      - name: "Publish Level 3: atrg-feed"
        run: cargo publish -p atrg-feed --no-verify || echo "Already published"

      - name: "Publish Level 3: atrg-label"
        run: cargo publish -p atrg-label --no-verify || echo "Already published"

      - name: "Publish Level 3: atrg-testing"
        run: cargo publish -p atrg-testing --no-verify || echo "Already published"

  # Create a GitHub Release with auto-generated notes
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "body=Initial release of at-rust-go v$VERSION" >> "$GITHUB_OUTPUT"
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "body<<$EOF" >> "$GITHUB_OUTPUT"
            echo "## What's Changed" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$NOTES" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "## Crates Published" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "| Crate | Version | crates.io |" >> "$GITHUB_OUTPUT"
            echo "|-------|---------|-----------|" >> "$GITHUB_OUTPUT"
            for crate in atrg-db atrg-identity atrg-stream atrg-firehose atrg-codegen atrg-core atrg-auth atrg-xrpc atrg-cli atrg-repo atrg-feed atrg-label atrg-testing; do
              echo "| \`$crate\` | $VERSION | [crates.io](https://crates.io/crates/$crate) |" >> "$GITHUB_OUTPUT"
            done
            echo "$EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "at-rust-go v${{ env.VERSION }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
