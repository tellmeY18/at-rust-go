name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # Delay between publishing dependent crates to allow crates.io index propagation
  PUBLISH_DELAY: 90

jobs:
  # Gate: ensure the workspace builds and tests pass before publishing
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match workspace version ($CARGO_VERSION)"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Verify workspace builds for release
        run: cargo build --workspace --release

  # Publish all crates in topological dependency order
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: verify
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io
        run: cargo login "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      # Helper: publish with retry. crates.io index propagation can take
      # up to 2 minutes; retry 3 times with 60s waits before giving up.
      - name: Create publish helper
        run: |
          cat > /tmp/publish.sh << 'SCRIPT'
          #!/bin/bash
          set -uo pipefail
          CRATE="$1"
          for attempt in 1 2 3; do
            echo "  Attempt $attempt: cargo publish -p $CRATE"
            OUTPUT=$(cargo publish -p "$CRATE" --no-verify 2>&1) && {
              echo "  ✓ $CRATE published"
              exit 0
            }
            # Check if the crate version already exists (not an error)
            if echo "$OUTPUT" | grep -qE "already (uploaded|exists)"; then
              echo "  ✓ $CRATE already published (skipping)"
              exit 0
            fi
            echo "  Output: $OUTPUT"
            if [ $attempt -lt 3 ]; then
              echo "  ⏳ Waiting 60s before retry..."
              sleep 60
            fi
          done
          echo "  ✗ $CRATE failed after 3 attempts"
          exit 1
          SCRIPT
          chmod +x /tmp/publish.sh

      # Level 0 — Leaf crates (no internal dependencies)
      - name: "Publish Level 0: atrg-db"
        run: bash /tmp/publish.sh atrg-db

      - name: "Publish Level 0: atrg-identity"
        run: bash /tmp/publish.sh atrg-identity

      - name: "Publish Level 0: atrg-firehose"
        run: bash /tmp/publish.sh atrg-firehose

      - name: "Publish Level 0: atrg-codegen"
        run: bash /tmp/publish.sh atrg-codegen

      - name: "Publish Level 0: atrg-blob"
        run: bash /tmp/publish.sh atrg-blob

      - name: Wait for crates.io index propagation (Level 0 → Level 1)
        run: sleep $PUBLISH_DELAY

      # Level 1 — Depends only on atrg-db (Level 0)
      - name: "Publish Level 1: atrg-stream"
        run: bash /tmp/publish.sh atrg-stream

      - name: "Publish Level 1: atrg-email"
        run: bash /tmp/publish.sh atrg-email

      - name: Wait for crates.io index propagation (Level 1 → Level 2)
        run: sleep $PUBLISH_DELAY

      # Level 2 — Depends on Level 0 + Level 1 (atrg-core needs stream, identity, db, firehose)
      - name: "Publish Level 2: atrg-core"
        run: bash /tmp/publish.sh atrg-core

      - name: Wait for crates.io index propagation (Level 2 → Level 3)
        run: sleep $PUBLISH_DELAY

      # Level 3 — Depends on atrg-core
      - name: "Publish Level 3: atrg-auth"
        run: bash /tmp/publish.sh atrg-auth

      - name: "Publish Level 3: atrg-xrpc"
        run: bash /tmp/publish.sh atrg-xrpc

      - name: "Publish Level 3: atrg-cli"
        run: bash /tmp/publish.sh atrg-cli

      - name: Wait for crates.io index propagation (Level 3 → Level 4)
        run: sleep $PUBLISH_DELAY

      # Level 4 — Depends on atrg-auth / atrg-xrpc
      - name: "Publish Level 4: atrg-repo"
        run: bash /tmp/publish.sh atrg-repo

      - name: "Publish Level 4: atrg-feed"
        run: bash /tmp/publish.sh atrg-feed

      - name: "Publish Level 4: atrg-label"
        run: bash /tmp/publish.sh atrg-label

      - name: "Publish Level 4: atrg-testing"
        run: bash /tmp/publish.sh atrg-testing

  # Create a GitHub Release with auto-generated notes
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "body=Initial release of at-rust-go v$VERSION" >> "$GITHUB_OUTPUT"
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "body<<$EOF" >> "$GITHUB_OUTPUT"
            echo "## What's Changed" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$NOTES" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "## Crates Published" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "| Crate | Version | crates.io |" >> "$GITHUB_OUTPUT"
            echo "|-------|---------|-----------|" >> "$GITHUB_OUTPUT"
            for crate in atrg-db atrg-identity atrg-stream atrg-firehose atrg-codegen atrg-blob atrg-core atrg-email atrg-auth atrg-xrpc atrg-cli atrg-repo atrg-feed atrg-label atrg-testing; do
              echo "| \`$crate\` | $VERSION | [crates.io](https://crates.io/crates/$crate) |" >> "$GITHUB_OUTPUT"
            done
            echo "$EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "at-rust-go v${{ env.VERSION }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
