[app]
name = "social-example"
host = "127.0.0.1"
port = 3000
secret_key = "example-secret-key-change-in-production!"
cors_origins = ["http://localhost:5173"]
environment = "development"

[auth]
client_id = "http://localhost:3000/client-metadata.json"
redirect_uri = "http://localhost:3000/auth/callback"
scope = "atproto transition:generic"

[database]
url = "sqlite://social.db"

[jetstream]
host = "jetstream1.us-east.bsky.network"
collections = ["app.bsky.feed.post", "app.bsky.feed.like", "app.bsky.graph.follow"]
