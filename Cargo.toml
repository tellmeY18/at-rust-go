[workspace]
resolver = "2"
members = [
    "crates/atrg-core",
    "crates/atrg-auth",
    "crates/atrg-stream",
    "crates/atrg-firehose",
    "crates/atrg-db",
    "crates/atrg-xrpc",
    "crates/atrg-identity",
    "crates/atrg-codegen",
    "crates/atrg-testing",
    "crates/atrg-cli",
    "crates/atrg-repo",
    "crates/atrg-feed",
    "crates/atrg-label",
    "crates/atrg-blob",
    "crates/atrg-email",
    "tests/postgres-e2e",
    "examples/minimal",
    "examples/social",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "LGPL-3.0-only"
repository = "https://github.com/tellmeY18/at-rust-go"
homepage = "https://github.com/tellmeY18/at-rust-go"
authors = ["tellmeY18"]
rust-version = "1.80"

[workspace.dependencies]
# Internal crates — version is required for crates.io publishing.
# Defaults are kept ON in the workspace declarations so that any crate
# pulling them in transitively (e.g. atrg-repo → atrg-core) gets a working
# default backend (`sqlite`). Crates that want to override the feature set
# must do so locally with `default-features = false`.
atrg-core = { path = "crates/atrg-core", version = "0.2.0", default-features = true }
atrg-auth = { path = "crates/atrg-auth", version = "0.2.0", default-features = true }
atrg-stream = { path = "crates/atrg-stream", version = "0.2.0" }
atrg-db = { path = "crates/atrg-db", version = "0.2.0", default-features = true }
atrg-xrpc = { path = "crates/atrg-xrpc", version = "0.2.0" }
atrg-identity = { path = "crates/atrg-identity", version = "0.2.0" }
atrg-codegen = { path = "crates/atrg-codegen", version = "0.2.0" }
atrg-testing = { path = "crates/atrg-testing", version = "0.2.0" }
atrg-repo = { path = "crates/atrg-repo", version = "0.2.0" }
atrg-firehose = { path = "crates/atrg-firehose", version = "0.2.0" }
atrg-feed = { path = "crates/atrg-feed", version = "0.2.0" }
atrg-label = { path = "crates/atrg-label", version = "0.2.0" }
atrg-blob = { path = "crates/atrg-blob", version = "0.2.0" }
atrg-email = { path = "crates/atrg-email", version = "0.2.0" }

# AT Protocol — DO NOT reimplement anything these provide
atproto-identity = "0.14.2"
atproto-oauth = "0.14.2"
atproto-oauth-aip = "0.14.2"
atproto-oauth-axum = "0.14.2"
atproto-client = "0.14.2"
atproto-xrpcs = "0.14.2"
atproto-jetstream = "0.14.2"
atproto-record = "0.14.2"
atproto-extras = "0.14.2"
atproto-lexicon = "0.14.2"

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Database
#
# `atrg-db` exposes two cargo features (`sqlite`, default-on, and `postgres`,
# optional) that toggle the corresponding sqlx driver features. Apps that
# only need SQLite can use `atrg-db` as-is. Apps that want PostgreSQL enable
# the `postgres` feature on `atrg-db` (or on `atrg-core` / `atrg-cli`, which
# forward it). Both features may be enabled simultaneously, in which case
# `atrg-db::connect()` dispatches based on the URL scheme.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "migrate", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"

# Errors & Logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Caching
moka = { version = "0.12", features = ["future"] }

# JWT
jsonwebtoken = "9"

# Codegen
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"], default-features = false }

# Misc
url = "2"
rand = "0.8"
hex = "0.4"
include_dir = "0.7"
